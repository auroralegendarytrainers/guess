<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's That Pokémon?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { box-sizing: border-box; }
    * { font-family: 'Fredoka', sans-serif; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    @keyframes pulse-correct {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes reveal {
      from { filter: brightness(0) contrast(200%); }
      to { filter: brightness(1) contrast(1); }
    }

    .shake { animation: shake 0.3s ease-in-out; }
    .pulse-correct { animation: pulse-correct 0.5s ease-in-out; }
    .float { animation: float 3s ease-in-out infinite; }
    .timer-critical { animation: timer-pulse 0.5s ease-in-out infinite; }
    .reveal-animation { animation: reveal 0.8s ease-out forwards; }

    .shadow-image {
      filter: brightness(0) contrast(200%);
      transition: filter 0.3s ease;
    }

    .progress-fill { transition: width 0.3s ease; }

    /* Make images fill the container nicely */
    .game-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 1rem;
      display: block;
    }
  </style>
</head>

<body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">

    <!-- Start Screen -->
    <div id="start-screen" class="h-full flex flex-col items-center justify-center p-6 text-center">
      <div class="float">
        <svg width="120" height="120" viewBox="0 0 120 120" class="mb-6">
          <circle cx="60" cy="60" r="55" fill="#fff" opacity="0.2" />
          <text x="60" y="75" text-anchor="middle" font-size="60">🎯</text>
        </svg>
      </div>

      <h1 id="title-text" class="text-4xl md:text-5xl font-bold text-white mb-4 drop-shadow-lg">
        Who's That Pokémon?
      </h1>

      <p class="text-white/90 text-lg mb-8 max-w-md">
        Guess the Pokémon from its silhouette! You have 15 seconds for each.
      </p>

      <button id="start-btn" onclick="startGame()"
        class="bg-white text-purple-600 font-bold text-xl px-10 py-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
        Start Game
      </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="h-full flex flex-col p-4 md:p-6 hidden">

      <!-- Header -->
      <div class="flex justify-between items-center mb-4">
        <div class="bg-white/20 backdrop-blur-sm rounded-full px-4 py-2">
          <span class="text-white font-semibold">Round <span id="round-num">1</span>/10</span>
        </div>
        <div class="bg-white/20 backdrop-blur-sm rounded-full px-4 py-2">
          <span class="text-white font-semibold">Score: <span id="score">0</span></span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-white/20 rounded-full h-2 mb-4">
        <div id="progress-bar" class="progress-fill bg-white h-2 rounded-full" style="width: 10%"></div>
      </div>

      <!-- Timer -->
      <div class="flex justify-center mb-4">
        <div id="timer-container" class="bg-white rounded-2xl px-6 py-3 shadow-lg flex items-center gap-3">
          <span id="timer-label-text" class="text-gray-600 font-medium">Time Left:</span>
          <span id="timer" class="text-3xl font-bold text-purple-600">15</span>
          <span class="text-gray-400">s</span>
        </div>
      </div>

      <!-- Image Display -->
      <div class="flex-1 flex items-center justify-center mb-4">
        <div id="image-container" class="w-full max-w-md aspect-square flex items-center justify-center p-2">
          <!-- image inserted here -->
        </div>
      </div>

      <!-- Answer Input -->
      <form id="answer-form" class="max-w-lg mx-auto w-full" onsubmit="checkAnswer(event)">
        <label for="answer-input" class="block text-white text-center font-semibold mb-2 text-lg">Who is it?</label>
        <div class="flex gap-3">
          <input type="text" id="answer-input"
            class="flex-1 px-6 py-4 text-xl font-semibold text-gray-800 rounded-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-white/50"
            placeholder="Type your answer..." autocomplete="off" required>
          <button type="submit" id="submit-btn"
            class="bg-white text-purple-600 font-bold text-lg px-8 py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
            Submit
          </button>
        </div>
      </form>

      <!-- Feedback -->
      <div id="feedback" class="text-center mt-4 h-8 text-xl font-bold"></div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="h-full overflow-auto p-6 hidden">
      <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-3xl p-8 md:p-10 shadow-2xl mb-6">

          <div class="text-6xl mb-4 text-center" id="results-emoji">🎉</div>
          <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">Game Over!</h2>
          <p class="text-gray-600 mb-6 text-center">Here's how you did:</p>

          <div class="bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl p-6 mb-6">
            <div class="text-white/80 text-lg text-center">Final Score</div>
            <div id="final-score" class="text-5xl font-bold text-white text-center">0</div>
            <div class="text-white/80 text-center">out of 10</div>
          </div>

          <div id="results-message" class="text-gray-600 mb-6 text-center"></div>

          <!-- Save -->
          <div id="save-score-section" class="mb-6 bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4">
            <h3 class="text-lg font-bold text-gray-800 mb-3 text-center">📊 Save to Google Sheet</h3>
            <form id="save-score-form" onsubmit="saveScore(event)" class="flex gap-2">
              <input type="text" id="player-name"
                class="flex-1 px-4 py-3 text-lg font-semibold text-gray-800 rounded-lg border-2 border-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                placeholder="Enter your name..." maxlength="20" required>
              <button type="submit" id="save-score-btn"
                class="bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-bold text-lg px-6 py-3 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200">
                Save
              </button>
            </form>
            <div id="save-feedback" class="mt-2 text-center text-sm font-semibold"></div>
          </div>

          <!-- ✅ Leaderboard -->
          <div class="mb-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center justify-center gap-2">🏆 Leaderboard</h3>
            <div class="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-xl p-4 border-2 border-yellow-300">
              <div id="leaderboard-status" class="text-center text-gray-500 py-2 text-sm"></div>
              <div id="leaderboard-list" class="space-y-2">
                <!-- entries inserted here -->
              </div>
            </div>
          </div>

          <!-- Detailed Results -->
          <div class="mb-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Your Answers</h3>
            <div id="results-overview" class="space-y-3 max-h-96 overflow-y-auto"></div>
          </div>

          <div class="flex gap-3">
            <button onclick="shareResults()" class="flex-1 bg-blue-500 text-white font-bold text-lg px-6 py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
              📤 Share Results
            </button>
            <button onclick="restartGame()" class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-lg px-6 py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
              Play Again
            </button>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script>
    // ✅ Your Google Apps Script Web App URL
    const GOOGLE_SHEETS_WEBAPP_URL =
      "https://script.google.com/macros/s/AKfycbzh-lzyUJgdPfx3Br3WGpm6A1_Nvo8u5OWgEpc_rAvu0oSNBUst8xhPAeGzXIkxOv2Frw/exec";

    // Game state
    let currentRound = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval = null;
    let gameActive = false;
    let gameResults = [];
    let isSaving = false;
    let roundStartTime = 0;
    let roundTimes = [];

    // ✅ Game data (shadow + reveal + multiple accepted answers)
    const gameData = [
      { shadowUrl: "images/ivysaur_shadow.png",        revealUrl: "images/ivysaur_real.png",        answers: ["ivysaur"] },
      { shadowUrl: "images/arceus_shadow.png",         revealUrl: "images/arceus_real.png",         answers: ["arceus"] },
      { shadowUrl: "images/jigglypuffball_shadow.png", revealUrl: "images/jigglypuffball_real.png", answers: ["jigglypuff beach ball", "jigglypuff ball", "jigglypuff", "beach ball jigglypuff"] },
      { shadowUrl: "images/sphealscarf_shadow.png",    revealUrl: "images/sphealscarf_real.png",    answers: ["spheal with a scarf", "spheal costume", "spheal wearing a scarf", "spheal scarf", "spheal"] },
      { shadowUrl: "images/wattrell_shadow.png",       revealUrl: "images/wattrell_real.png",       answers: ["wattrel", "wattrell"] },
      { shadowUrl: "images/treecko_shadow.png",        revealUrl: "images/trecko_real.png",        answers: ["treecko"] },
      { shadowUrl: "images/sawsbuck_shadow.png",       revealUrl: "images/sawsbuck_real.png",       answers: ["sawsbuck"] },
      { shadowUrl: "images/feebas_shadow.png",         revealUrl: "images/feebas_real.png",         answers: ["feebas"] },
      { shadowUrl: "images/megablaziken_shadow.png",   revealUrl: "images/megablaziken_real.png",   answers: ["mega blaziken", "blaziken", "megablaziken"] },
      { shadowUrl: "images/gmaxmachamp_shadow.png",    revealUrl: "images/gmaxmachamp_real.png",    answers: ["gigantamax machamp", "gmax machamp", "machamp", "g-max machamp"] }
    ];

    function displayName(roundData) {
      const raw = roundData.answers[0] || "";
      return raw.split(" ").map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ");
    }

    function normalize(s) {
      return (s || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    // ---------------------------
    // ✅ LEADERBOARD (reads from your Web App)
    // IMPORTANT: Your Apps Script must return JSON on GET, like:
    // { "success": true, "rows": [ {name:"Madi", score:8, total_time:90, timestamp:...}, ... ] }
    // ---------------------------
   async function loadLeaderboard() {
  try {
    const res = await fetch(GOOGLE_SHEETS_WEBAPP_URL);
    const data = await res.json();

    const list = document.getElementById("leaderboard-list");
    list.innerHTML = "";

    if (!data || !data.length) {
      list.innerHTML = "<div class='text-center text-gray-500'>No scores yet.</div>";
      return;
    }

    data
      .sort((a, b) => b.score - a.score || a.total_time - b.total_time)
      .slice(0, 20)
      .forEach((entry, i) => {
        const div = document.createElement("div");
        div.className =
          "flex justify-between items-center bg-gray-100 rounded-lg p-3";

        div.innerHTML = `
          <div class="font-bold">${i + 1}. ${entry.name}</div>
          <div class="text-purple-600 font-semibold">${entry.score}/10</div>
        `;

        list.appendChild(div);
      });
  } catch (err) {
    console.error("Leaderboard load error:", err);
  }
}

    // Start game
    function startGame() {
      currentRound = 0;
      score = 0;
      gameActive = true;
      gameResults = [];
      roundTimes = [];

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      updateScore();
      loadRound();
    }

    // Load round
    function loadRound() {
      if (currentRound >= gameData.length) {
        endGame();
        return;
      }

      const roundData = gameData[currentRound];

      document.getElementById('round-num').textContent = currentRound + 1;
      document.getElementById('progress-bar').style.width = `${((currentRound + 1) / gameData.length) * 100}%`;

      const imageContainer = document.getElementById('image-container');
      imageContainer.innerHTML = `
        <img
          id="round-image"
          src="${roundData.shadowUrl}"
          alt="Mystery Pokémon"
          class="game-image shadow-image"
          onerror="this.style.display='none';"
        />
      `;

      const answerInput = document.getElementById('answer-input');
      answerInput.value = '';
      answerInput.disabled = false;
      answerInput.focus();

      document.getElementById('submit-btn').disabled = false;

      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'text-center mt-4 h-8 text-xl font-bold';

      roundStartTime = Date.now();
      startTimer();
    }

    function startTimer() {
      timeLeft = 15;
      updateTimerDisplay();

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 5) {
          const t = document.getElementById('timer');
          t.classList.add('timer-critical', 'text-red-500');
          t.classList.remove('text-purple-600');
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timeUp();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timer').textContent = timeLeft;
    }

    function revealImage() {
      const roundData = gameData[currentRound];
      const imageContainer = document.getElementById('image-container');
      imageContainer.innerHTML = `
        <img
          src="${roundData.revealUrl}"
          alt="${displayName(roundData)}"
          class="game-image reveal-animation"
          onerror="this.style.display='none';"
        />
      `;
    }

    function timeUp() {
      gameActive = false;
      const roundData = gameData[currentRound];

      const timeTaken = 15;
      roundTimes.push(timeTaken);

      gameResults.push({
        round: currentRound + 1,
        imageUrl: roundData.revealUrl,
        correctAnswer: displayName(roundData),
        userAnswer: '',
        isCorrect: false,
        timeUp: true,
        timeTaken
      });

      document.getElementById('answer-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;

      revealImage();

      document.getElementById('feedback').textContent = `⏰ Time's up! It was: ${displayName(roundData)}`;
      document.getElementById('feedback').classList.add('text-yellow-200');
      document.getElementById('image-container').classList.add('shake');

      setTimeout(() => {
        document.getElementById('image-container').classList.remove('shake');
        const t = document.getElementById('timer');
        t.classList.remove('timer-critical', 'text-red-500');
        t.classList.add('text-purple-600');
        currentRound++;
        gameActive = true;
        loadRound();
      }, 2500);
    }

    function checkAnswer(event) {
      event.preventDefault();
      if (!gameActive) return;

      clearInterval(timerInterval);
      gameActive = false;

      const roundData = gameData[currentRound];
      const userAnswerRaw = document.getElementById('answer-input').value.trim();
      const userAnswer = normalize(userAnswerRaw);

      const timeTaken = Math.round((Date.now() - roundStartTime) / 1000);
      roundTimes.push(timeTaken);

      document.getElementById('answer-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;

      const isCorrect = roundData.answers
        .map(a => normalize(a))
        .some(a => a === userAnswer);

      revealImage();

      gameResults.push({
        round: currentRound + 1,
        imageUrl: roundData.revealUrl,
        correctAnswer: displayName(roundData),
        userAnswer: userAnswerRaw,
        isCorrect,
        timeUp: false,
        timeTaken
      });

      if (isCorrect) {
        score++;
        updateScore();
        document.getElementById('feedback').textContent = '✨ Correct! Great job!';
        document.getElementById('feedback').classList.add('text-green-300');
        document.getElementById('image-container').classList.add('pulse-correct');
      } else {
        document.getElementById('feedback').textContent = `❌ Wrong! It was: ${displayName(roundData)}`;
        document.getElementById('feedback').classList.add('text-red-300');
        document.getElementById('image-container').classList.add('shake');
      }

      setTimeout(() => {
        document.getElementById('image-container').classList.remove('pulse-correct', 'shake');
        const t = document.getElementById('timer');
        t.classList.remove('timer-critical', 'text-red-500');
        t.classList.add('text-purple-600');
        currentRound++;
        gameActive = true;
        loadRound();
      }, 2000);
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function endGame() {
      clearInterval(timerInterval);

      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.remove('hidden');

      document.getElementById('final-score').textContent = score;

      let emoji, message;
      if (score === 10) { emoji = '🏆'; message = "Perfect score! You're a guessing master!"; }
      else if (score >= 8) { emoji = '🌟'; message = "Amazing! You've got sharp eyes!"; }
      else if (score >= 6) { emoji = '😊'; message = "Good job! Keep practicing!"; }
      else if (score >= 4) { emoji = '🤔'; message = "Not bad! You can do better!"; }
      else { emoji = '💪'; message = "Keep trying! Practice makes perfect!"; }

      document.getElementById('results-emoji').textContent = emoji;
      document.getElementById('results-message').textContent = message;

      document.getElementById('player-name').value = '';
      document.getElementById('save-feedback').textContent = '';
      document.getElementById('save-score-section').style.display = 'block';

      displayDetailedResults();
      loadLeaderboard(); // ✅ show leaderboard when results open
    }

    // ✅ Save score to Google Sheet
    async function saveScore(event) {
      event.preventDefault();
      if (isSaving) return;

      const playerName = document.getElementById("player-name").value.trim();
      if (!playerName) return;

      isSaving = true;

      const btn = document.getElementById("save-score-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      const totalTime = roundTimes.reduce((sum, t) => sum + t, 0);

      const scoreData = {
        name: playerName,
        score,
        timestamp: Date.now(),
        total_time: totalTime,
      };

      for (let i = 0; i < gameData.length; i++) {
        scoreData[`round_${i + 1}_time`] = roundTimes[i] ?? 15;
      }

      // We try a normal CORS POST first (best).
      // If your Apps Script doesn't return CORS headers, we fall back to no-cors and still show success.
      try {
        let saved = false;

        try {
          const res = await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(scoreData),
          });

          // If it returns JSON, great:
          const json = await res.json().catch(() => null);
          if (res.ok && (json?.success === true || json?.ok === true || json)) {
            saved = true;
          }
        } catch (corsErr) {
          // fallback below
        }

        if (!saved) {
          // fallback (no-cors). You cannot read response, but it will still POST.
          await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(scoreData),
          });
          saved = true;
        }

        if (saved) {
          document.getElementById("save-feedback").textContent = "✅ Score saved!";
          document.getElementById("save-feedback").className =
            "mt-2 text-center text-sm font-semibold text-green-600";
          document.getElementById("save-score-section").style.display = "none";

          // ✅ refresh leaderboard after saving
          await loadLeaderboard();
        } else {
          throw new Error("Save failed");
        }
      } catch (err) {
        console.error("SAVE ERROR:", err);

        document.getElementById("save-feedback").textContent =
          "❌ Failed to save. Try again!";
        document.getElementById("save-feedback").className =
          "mt-2 text-center text-sm font-semibold text-red-600";

        btn.disabled = false;
        btn.textContent = "Save";
      } finally {
        isSaving = false;
      }
    }

    function displayDetailedResults() {
      const container = document.getElementById('results-overview');
      container.innerHTML = '';

      gameResults.forEach((result) => {
        const resultDiv = document.createElement('div');
        resultDiv.className = `flex items-center gap-3 p-4 rounded-xl border-2 ${
          result.isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'
        }`;

        const imageDiv = document.createElement('div');
        imageDiv.className = 'flex-shrink-0 w-16 h-16 bg-white rounded-lg flex items-center justify-center p-1';
        imageDiv.innerHTML = `<img src="${result.imageUrl}" alt="${result.correctAnswer}" class="w-full h-full object-contain rounded" onerror="this.style.display='none';">`;

        const infoDiv = document.createElement('div');
        infoDiv.className = 'flex-1 min-w-0';

        const roundLabel = document.createElement('div');
        roundLabel.className = 'font-bold text-gray-800 text-sm';
        roundLabel.textContent = `Round ${result.round} (${result.timeTaken}s)`;

        const answerInfo = document.createElement('div');
        answerInfo.className = 'text-sm text-gray-600 truncate';
        if (result.timeUp) {
          answerInfo.innerHTML = `⏰ <span class="font-semibold">Time's Up!</span> - Answer: ${result.correctAnswer}`;
        } else if (result.isCorrect) {
          answerInfo.innerHTML = `✅ <span class="font-semibold">${result.userAnswer}</span>`;
        } else {
          answerInfo.innerHTML = `❌ Your answer: <span class="font-semibold">${result.userAnswer}</span> | Correct: <span class="font-semibold">${result.correctAnswer}</span>`;
        }

        const statusIcon = document.createElement('div');
        statusIcon.className = 'flex-shrink-0 text-2xl';
        statusIcon.textContent = result.isCorrect ? '✅' : '❌';

        infoDiv.appendChild(roundLabel);
        infoDiv.appendChild(answerInfo);

        resultDiv.appendChild(imageDiv);
        resultDiv.appendChild(infoDiv);
        resultDiv.appendChild(statusIcon);

        container.appendChild(resultDiv);
      });
    }

    function shareResults() {
      let shareText = `🎯 Who's That Pokémon?\n\nFinal Score: ${score}/10\n\n`;
      gameResults.forEach((r) => {
        shareText += `Round ${r.round}: ${r.isCorrect ? '✅' : '❌'} (${r.timeTaken}s)\n`;
      });

      const totalTime = roundTimes.reduce((sum, t) => sum + t, 0);
      const minutes = Math.floor(totalTime / 60);
      const seconds = totalTime % 60;
      shareText += `\nTotal Time: ${minutes}:${seconds.toString().padStart(2, '0')}\nCan you beat my score?`;

      if (navigator.share) {
        navigator.share({ title: "Who's That Pokémon?", text: shareText }).catch(() => copyToClipboard(shareText));
      } else {
        copyToClipboard(shareText);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Results copied to clipboard! 📋'))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Results copied to clipboard! 📋');
      } catch (err) {
        showToast('Unable to copy. Please screenshot your results! 📸');
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => document.body.removeChild(toast), 300);
      }, 2500);
    }

    function restartGame() { startGame(); }
  </script>
</body>
</html>
